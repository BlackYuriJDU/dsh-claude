# The dsh-dshc bundle patch: the DSHC identity over dsh-base and dsh-web-app.
# Applied after the web-app layer; the profile's own cordis.patch.yml and any
# --patch overlays still come after it.

# The DSHC brand occupies the same single slots as the official brand.
- id: ui-brand-official
  disabled: true

- insert:
    # Claude-app palette layer over the theme service, plus the DSHC mark.
    - id: ui-brand-dshc
      name: '@deepseek-ai/dsh-client-ui-brand-dshc'

    # Keyless web search through a SearXNG instance. The provider reads
    # $SEARXNG_URL and stays unavailable without it, so the web service keeps
    # selecting among the other usable providers.
    - id: web-search-searxng
      name: '@deepseek-ai/dsh-web-search-searxng'

    # Saved memories: a Settings section and a runtime-context contribution
    # that carries the list into every session.
    - id: ui-memory
      name: '@deepseek-ai/dsh-client-ui-memory'

    # Per-workspace projects: instructions and knowledge files for sessions
    # that run inside a workspace folder.
    - id: ui-projects
      name: '@deepseek-ai/dsh-client-ui-projects'

# The DSHC presets (presets/*.patch.yml, listed after this file in
# package.json `dsh.bundle.patch`) replace the upstream standard preset: Code
# keeps its tool set with the DSHC engineering persona. New sessions start in
# Chat; the Settings choice still overrides this default.
- id: preset-standard
  disabled: true

# PTC and Minimal describe themselves relative to the standard preset that
# Code replaces; Creator stays after the three DSHC presets.
- id: preset-ptc
  disabled: true

- id: preset-minimal
  disabled: true

- id: agent-preset-registry
  config:
    default: chat
